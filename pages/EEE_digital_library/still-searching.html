<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#3b2411" />
  <title>Still Searching | Digital Library</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; padding: 24px; color: #1b1712; text-align: center;
      font-family: "DM Sans", "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 15% 0%, rgba(232,213,176,.45), transparent 45%),
        radial-gradient(ellipse at 90% 100%, rgba(214,170,106,.25), transparent 45%),
        #fffdf6;
    }
    .card {
      width: min(100%, 520px); padding: 40px 32px 36px; border-radius: 26px;
      border: 1px solid rgba(91,65,34,.12);
      background: linear-gradient(145deg, #fffefa 0%, #fff 58%, #f9f1e4 100%);
      box-shadow: 0 18px 44px rgba(53,35,17,.12);
    }
    .scene { position: relative; width: 170px; height: 150px; margin: 0 auto 22px; }
    .scene svg { width: 100%; height: 100%; overflow: visible; }
    .lens { transform-origin: 85px 80px; animation: search 4.2s ease-in-out infinite; }
    @keyframes search {
      0%   { transform: translate(-34px, -8px) rotate(-8deg); }
      25%  { transform: translate(30px, -22px) rotate(6deg); }
      50%  { transform: translate(34px, 20px) rotate(-4deg); }
      75%  { transform: translate(-26px, 24px) rotate(8deg); }
      100% { transform: translate(-34px, -8px) rotate(-8deg); }
    }
    .qmark { animation: pulse 1.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes pulse { 0%,100% { opacity: .35; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.08); } }
    .eyebrow { margin: 0 0 10px; color: #96764d; font-size: .74rem; font-weight: 800; letter-spacing: 2px; }
    h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.3rem); line-height: 1.15; letter-spacing: -1px; color: #3b2411; }
    p.msg { margin: 14px auto 0; max-width: 380px; color: #71695f; font-size: 1rem; line-height: 1.6; }
    .dots { display: inline-flex; gap: 6px; margin-top: 22px; }
    .dots i { width: 9px; height: 9px; border-radius: 50%; background: #74502d; animation: bounce 1.2s ease-in-out infinite; }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-7px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .lens, .qmark, .dots i { animation: none; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="scene" aria-hidden="true">
      <svg viewBox="0 0 170 150" fill="none">
        <!-- open book -->
        <path d="M85 40c-14-9-34-11-56-6v70c22-5 42-3 56 6z" fill="#7b552d"/>
        <path d="M85 40c14-9 34-11 56-6v70c-22-5-42-3-56 6z" fill="#3b2411"/>
        <path d="M85 40v70" stroke="#fff7e9" stroke-opacity=".35" stroke-width="2"/>
        <path d="M40 54c10-2 22-1 34 3M40 66c10-2 22-1 34 3M40 78c10-2 22-1 34 3" stroke="#fff7e9" stroke-opacity=".3" stroke-width="2" stroke-linecap="round"/>
        <path d="M96 57c12-4 24-5 34-3M96 69c12-4 24-5 34-3" stroke="#fff7e9" stroke-opacity=".3" stroke-width="2" stroke-linecap="round"/>
        <text class="qmark" x="85" y="130" text-anchor="middle" font-size="22" font-weight="800" fill="#d6aa6a">?</text>
        <!-- magnifying glass -->
        <g class="lens">
          <circle cx="85" cy="72" r="19" fill="rgba(255,253,246,.55)" stroke="#2b190c" stroke-width="5"/>
          <path d="M98 86l18 18" stroke="#2b190c" stroke-width="7" stroke-linecap="round"/>
          <path d="M75 64a13 13 0 0 1 9-6" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
        </g>
      </svg>
    </div>

    <p class="eyebrow">BOOK NOT AVAILABLE YET</p>
    <h1>We're still searching this book</h1>
    <p class="msg">We haven't found a copy of this book yet. Please check back soon, it will be added to the library once we find it.</p>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </main>
</body>
</html>
